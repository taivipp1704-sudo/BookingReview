server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: false
    session:
      timeout: 15m
      cookie:
        name: CLARITYCAM_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  tomcat:
    max-swallow-size: 11MB
    max-http-form-post-size: 11MB

spring:
  application:
    name: claritycam-platform-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    user: ${FLYWAY_USERNAME:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
    show-sql: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh

claritycam:
  features:
    booking-enabled: ${BOOKING_ENABLED:false}
    early-access-registration-enabled: ${EARLY_ACCESS_REGISTRATION_ENABLED:true}
  cors-origins: ${CORS_ORIGINS}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  bootstrap-admin: ${BOOTSTRAP_ADMIN:false}
  admin:
    email: ${CLARITYCAM_ADMIN_EMAIL}
    password: ${CLARITYCAM_ADMIN_PASSWORD}
  otp:
    expose-demo-code: ${OTP_EXPOSE_DEMO_CODE:false}
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  sms:
    provider: ${SMS_PROVIDER:none}
    esms:
      api-url: ${ESMS_API_URL:https://rest.esms.vn/MainService.svc/json/SendMultipleMessage_V4_post_json/}
      api-key: ${ESMS_API_KEY:}
      secret-key: ${ESMS_SECRET_KEY:}
      brandname: ${ESMS_BRANDNAME:}
      template: ${ESMS_TEMPLATE:}
      sms-type: ${ESMS_SMS_TYPE:2}
      is-unicode: ${ESMS_IS_UNICODE:0}
      sandbox: ${ESMS_SANDBOX:false}
  identity-storage: ${IDENTITY_STORAGE:./private-data/identity}
  identity-storage-provider: ${IDENTITY_STORAGE_PROVIDER:local}
  identity-encryption-key: ${IDENTITY_ENCRYPTION_KEY}
  identity-retention-days: ${IDENTITY_RETENTION_DAYS:30}
  identity-cleanup-ms: ${IDENTITY_CLEANUP_MS:3600000}
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  monitoring:
    alert-webhook-url: ${ALERT_WEBHOOK_URL:}
    alert-cooldown-minutes: ${ALERT_COOLDOWN_MINUTES:15}
    database-check-ms: ${DATABASE_HEALTH_CHECK_MS:60000}
  rate-limit:
    cleanup-ms: ${RATE_LIMIT_CLEANUP_MS:600000}

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: true

info:
  app:
    name: AMY Digital preview API
    booking-enabled: ${BOOKING_ENABLED:false}
