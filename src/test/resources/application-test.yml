spring:
  datasource:
    url: jdbc:h2:mem:claritycam_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

claritycam:
  cors-origins: http://127.0.0.1:5175
  seed-demo-data: true
  admin:
    email: admin@claritycam.local
    password: change-me-now
  identity-encryption-key: test-only-encryption-key-32-bytes
  features:
    booking-enabled: true
  otp:
    expose-demo-code: true
