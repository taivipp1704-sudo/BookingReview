services:
  - type: web
    name: booking-review-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: commit
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_USERNAME
        sync: false
      - key: FLYWAY_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLARITYCAM_ADMIN_PASSWORD
        sync: false
      - key: CLARITYCAM_ADMIN_EMAIL
        sync: false
      - key: IDENTITY_ENCRYPTION_KEY
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: IDENTITY_STORAGE_PROVIDER
        value: "r2"
      - key: R2_ENDPOINT
        value: "https://e2e8b840e5c1f1705e716b4a4a91ad00.r2.cloudflarestorage.com"
      - key: R2_BUCKET
        value: "bookingreview-identity-private"
      - key: BOOTSTRAP_ADMIN
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FORWARD_HEADERS_STRATEGY
        value: "framework"
      - key: OTP_EXPOSE_DEMO_CODE
        value: "false"
      - key: SMS_PROVIDER
        value: "none"
      - key: BOOKING_ENABLED
        value: "true"
      - key: EARLY_ACCESS_REGISTRATION_ENABLED
        value: "true"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: JPA_DDL_AUTO
        value: "validate"
      - key: ESMS_API_KEY
        sync: false
      - key: ESMS_SECRET_KEY
        sync: false
      - key: ESMS_BRANDNAME
        sync: false
      - key: ESMS_TEMPLATE
        sync: false
      - key: ESMS_SMS_TYPE
        value: "2"
      - key: ESMS_IS_UNICODE
        value: "0"
      - key: ESMS_SANDBOX
        value: "false"
